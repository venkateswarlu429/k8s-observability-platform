data:
  slo-error-budget.json: |
    {
      "uid": "slo-error-budget",
      "title": "SLO & Error Budget \u2014 99.9% / 30d",
      "description": "Availability SLO dashboard fed entirely by the recording rules in alerts/. SLI, budget remaining, and burn rates for every alerting window.",
      "tags": [
        "slo",
        "error-budget",
        "sre",
        "platform"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "1m",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "default",
              "value": "default"
            },
            "hide": 0,
            "refresh": 1
          },
          {
            "name": "job",
            "label": "Service (job)",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "query": "label_values(http_requests_total, job)",
            "current": {
              "text": "demo-app",
              "value": "demo-app"
            },
            "refresh": 2,
            "sort": 1,
            "includeAll": false,
            "multi": false
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "About this SLO",
          "type": "text",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 3
          },
          "options": {
            "mode": "markdown",
            "content": "### SLO: 99.9% availability over a rolling 30-day window\n\n**SLI** = 1 \u2212 (5xx requests \u00f7 all requests), measured from `http_requests_total` on the service itself \u2014 user-facing truth, not infrastructure health. **Error budget** = 0.1% of requests (\u224843 min of full outage/month). **Burn rate** = error ratio \u00f7 0.001; burn 1 exhausts the budget in exactly 30 days. Alerts pair long + short windows (SRE Workbook multi-window pattern) so pages mean *act now* and tickets mean *act today*."
          }
        },
        {
          "id": 2,
          "title": "Availability SLI (30d)",
          "type": "gauge",
          "description": "Rolling 30-day availability. The gauge floor is 99% so movement is visible; the SLO line is 99.9%.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 8,
            "h": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "1 - job:http_error_ratio:rate30d{job=~\"$job\"}",
              "instant": true,
              "range": false,
              "legendFormat": "SLI",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0.99,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.999
                  },
                  {
                    "color": "green",
                    "value": 0.9995
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          }
        },
        {
          "id": 3,
          "title": "Error budget remaining (30d)",
          "type": "gauge",
          "description": "Share of the 0.1% error budget still unspent in the current 30-day window. Below 25%: freeze risky changes. At 0%: the SLO is breached.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 8,
            "y": 3,
            "w": 8,
            "h": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "slo:error_budget_remaining:ratio30d{job=~\"$job\"}",
              "instant": true,
              "range": false,
              "legendFormat": "remaining",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.1
                  },
                  {
                    "color": "green",
                    "value": 0.25
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          }
        },
        {
          "id": 4,
          "title": "Current burn rate (1h)",
          "type": "stat",
          "description": "How fast the budget is burning right now. 1x = exactly on pace. 14.4x pages (2% of budget per hour).",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 16,
            "y": 3,
            "w": 8,
            "h": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "job:http_error_ratio:rate1h{job=~\"$job\"} / 0.001",
              "instant": true,
              "range": false,
              "legendFormat": "burn",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "orange",
                    "value": 6
                  },
                  {
                    "color": "red",
                    "value": 14.4
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          }
        },
        {
          "id": 5,
          "title": "Burn rate by window",
          "type": "timeseries",
          "description": "One line per alert window. A short window crossing above its long window is what fires the multi-window alerts \u2014 and what resets them.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 16,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "job:http_error_ratio:rate1h{job=~\"$job\"} / 0.001",
              "instant": false,
              "range": true,
              "legendFormat": "1h",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "job:http_error_ratio:rate6h{job=~\"$job\"} / 0.001",
              "instant": false,
              "range": true,
              "legendFormat": "6h",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "job:http_error_ratio:rate1d{job=~\"$job\"} / 0.001",
              "instant": false,
              "range": true,
              "legendFormat": "1d",
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "job:http_error_ratio:rate3d{job=~\"$job\"} / 0.001",
              "instant": false,
              "range": true,
              "legendFormat": "3d",
              "refId": "D"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "vector(1)",
              "instant": false,
              "range": true,
              "legendFormat": "budget pace 1x",
              "refId": "E"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "vector(14.4)",
              "instant": false,
              "range": true,
              "legendFormat": "page threshold 14.4x",
              "refId": "F"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 6,
          "title": "Error ratio by window",
          "type": "bargauge",
          "description": "The raw material of every burn-rate alert: recorded error ratios for all windows, side by side.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 16,
            "y": 9,
            "w": 8,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "job:http_error_ratio:rate5m{job=~\"$job\"}",
              "instant": true,
              "range": false,
              "legendFormat": "5m",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "job:http_error_ratio:rate30m{job=~\"$job\"}",
              "instant": true,
              "range": false,
              "legendFormat": "30m",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "job:http_error_ratio:rate1h{job=~\"$job\"}",
              "instant": true,
              "range": false,
              "legendFormat": "1h",
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "job:http_error_ratio:rate6h{job=~\"$job\"}",
              "instant": true,
              "range": false,
              "legendFormat": "6h",
              "refId": "D"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "job:http_error_ratio:rate1d{job=~\"$job\"}",
              "instant": true,
              "range": false,
              "legendFormat": "1d",
              "refId": "E"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "job:http_error_ratio:rate3d{job=~\"$job\"}",
              "instant": true,
              "range": false,
              "legendFormat": "3d",
              "refId": "F"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "job:http_error_ratio:rate30d{job=~\"$job\"}",
              "instant": true,
              "range": false,
              "legendFormat": "30d",
              "refId": "G"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.001
                  },
                  {
                    "color": "red",
                    "value": 0.006
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true
          }
        },
        {
          "id": 7,
          "title": "Error ratio trend vs budget",
          "type": "timeseries",
          "description": "The 30d line is the SLO itself: if it sits above 0.1%, the window is breached regardless of what the short windows are doing.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 16,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "job:http_error_ratio:rate1d{job=~\"$job\"}",
              "instant": false,
              "range": true,
              "legendFormat": "1d",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "job:http_error_ratio:rate30d{job=~\"$job\"}",
              "instant": false,
              "range": true,
              "legendFormat": "30d",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "vector(0.001)",
              "instant": false,
              "range": true,
              "legendFormat": "budget 0.1%",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 8,
          "title": "Availability trend (1 - error ratio)",
          "type": "timeseries",
          "description": "Availability over shorter windows \u2014 dips here are what users felt, even if the 30d SLO survives.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 16,
            "y": 18,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "1 - job:http_error_ratio:rate6h{job=~\"$job\"}",
              "instant": false,
              "range": true,
              "legendFormat": "6h",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "1 - job:http_error_ratio:rate1d{job=~\"$job\"}",
              "instant": false,
              "range": true,
              "legendFormat": "1d",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0.98,
              "max": 1,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ]
    }
