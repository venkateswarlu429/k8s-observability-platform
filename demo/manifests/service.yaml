apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: demo
  labels:
    app: demo-app
    app.kubernetes.io/name: demo-app
    # The ServiceMonitor copies this label into the Prometheus `job` label
    # (spec.jobLabel), which is what the SLO recording rules filter on:
    #   http_requests_total{job="demo-app"}
    job: demo-app
spec:
  selector:
    app: demo-app
  ports:
    - name: http
      port: 8080
      targetPort: http
